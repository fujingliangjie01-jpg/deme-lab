<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>出目研究所 Vol.8</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1721;color:#edf6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:650px;margin:auto;padding:16px 12px 45px}header{display:flex;justify-content:space-between;align-items:center;margin:5px 0 18px}h1{font-size:23px;margin:0}.vol{font-size:11px;color:#8aa5b5}.card{background:#152734;border:1px solid #2b4656;border-radius:14px;padding:13px;margin:10px 0}.muted{color:#a0b6c3;font-size:12px}.status{font-size:12px;color:#9fe2b5;margin:8px 0}select,button,input{font:inherit;border-radius:9px;padding:12px;border:0}select{background:#f5e9c5;color:#17232b;width:100%;font-weight:700}button{background:#319ce0;color:#fff;font-weight:800;cursor:pointer}button.alt{background:#304e61}button.danger{background:#5b3438}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.title{font-size:17px;font-weight:850;margin:0 0 10px}.race{font-size:20px;font-weight:900}.boats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.boat{background:#0b1924;border-left:5px solid var(--c);border-radius:8px;padding:9px 7px;min-width:0}.boat b{font-size:15px}.boat small{display:block;font-size:11px;color:#b8cad4;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;border-radius:6px;padding:3px 7px;background:#30485a;font-size:11px;margin-left:5px}.detail{border-top:1px solid #314a5b;margin-top:10px;padding-top:10px}.detail summary{cursor:pointer;font-weight:800;padding:5px 0}.detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 system-ui;color:#d6e4ed;background:#0b1924;border-radius:8px;padding:10px;max-height:280px;overflow:auto}.empty{padding:20px;text-align:center;color:#9eb4c0}.result{font-size:14px;font-weight:800;margin-top:10px}.hidden{display:none!important}#file{display:none}footer{margin-top:22px;color:#7894a5;font-size:11px;text-align:center}
</style></head><body><main class="wrap"><header><h1>出目研究所</h1><span class="vol">Vol.8</span></header>
<section class="card"><div class="title">受信レース <span id="count" class="tag">0件</span></div><div id="status" class="status">データを確認中…</div><select id="pick" aria-label="レースを選択"><option value="">受信データなし</option></select><div class="buttons"><button id="sync">受信を確認</button><button id="import" class="alt">JSON読込</button></div><input id="file" type="file" accept=".json,application/json"></section>
<section id="view" class="card hidden"><div class="race" id="race">—</div><div class="muted" id="date">—</div><div id="boats" class="boats"></div><div class="result" id="result">結果待ち</div><details class="detail"><summary>6艇診断・世間比較</summary><pre id="compare">未取得</pre></details><details class="detail"><summary>レース展望・直前情報</summary><pre id="outlook">未取得</pre></details><details class="detail"><summary>買い目・オッズ</summary><pre id="bets">未取得</pre></details><details class="detail"><summary>受信した元データ</summary><pre id="raw">—</pre></details></section>
<section id="empty" class="card empty">まだレースデータがありません。<br>BOAT HUNTERから転送してください。</section>
<details class="card"><summary class="title" style="cursor:pointer;margin:0">データ管理</summary><div class="buttons"><button id="export" class="alt">JSON出力</button><button id="clear" class="danger">全件削除</button></div><p class="muted">保存先はこのブラウザ内です。削除前にJSON出力してください。</p></details><footer>BOAT HUNTER 連携 / 1レース単位で保存</footer></main>
<script>(()=>{'use strict';const DB='DEME_LAB_RACES_V2',INBOX='BH_DEME_LAB_INBOX_V3',$=id=>document.getElementById(id);const safe=v=>v==null?'':typeof v==='string'?v:JSON.stringify(v,null,2);const read=()=>{try{let a=JSON.parse(localStorage.getItem(DB)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}};const write=a=>localStorage.setItem(DB,JSON.stringify(a));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(x){const h=x.hunter||x.hunterInput||{},r=x.race||{},e=x.environment||{},res=x.result||{};const date=r.date||'',stadium=r.stadium||r.stadiumName||'',raceNo=Number(r.raceNo||r.race||0);if(!date||!stadium||!raceNo)throw Error('日付・場・Rが不足しています');return {...x,key:`${date}_${stadium}_${raceNo}R`,race:{...r,date,stadium,raceNo},environment:e,hunterInput:{...(x.hunterInput||{}),...h,raw:x},result:res,source:'BOAT_HUNTER',receivedAt:new Date().toISOString()}}function save(x){const n=norm(x),a=read(),i=a.findIndex(v=>v.key===n.key||(v.race?.date===n.race.date&&v.race?.stadium===n.race.stadium&&Number(v.race?.raceNo)===n.race.raceNo));if(i>=0){const old=a[i];n.result=n.result?.confirmed?n.result:old.result||n.result;n.research=old.research||n.research||{};a[i]=n}else a.push(n);write(a);return n}function display(r){if(!r)return;$('view').classList.remove('hidden');$('empty').classList.add('hidden');const h=r.hunterInput||{},race=r.race||{},res=r.result||{},env=r.environment||{};$('race').textContent=`${race.stadiumName||race.stadium||'—'} ${race.raceNo||'—'}R`;$('date').textContent=race.date||'—';const cs=['#fff','#999','#ed303a','#2878dd','#f5d622','#36b96a'];$('boats').innerHTML=Array.from({length:6},(_,i)=>{let b=h.boats?.[i]||{};return `<div class="boat" style="--c:${cs[i]}"><b>${i+1}号艇</b><small>${esc(b.name||'未取得')}</small><small>${esc(safe(b.stats||b.evaluation||b.grade||''))}</small></div>`}).join('');$('result').textContent=res.confirmed?`結果 ${res.trifecta||res.combo||res.order?.join('-')||'—'}　${res.winningMove||res.technique||''}　${res.payout?Number(res.payout).toLocaleString()+'円':''}`:'結果待ち';$('compare').textContent=[h.marketComparison,h.sixBoatEvaluation,h.powerGap].filter(Boolean).map(safe).join('\n\n')||'未取得';$('outlook').textContent=[h.developmentEvaluation,h.outlook,h.beforeInfo,env.windSpeed!==undefined&&env.windSpeed!==''?`風 ${env.windSpeed}m ${env.windDirection||''}`:'',env.tide?`潮位 ${env.tide}`:''].filter(Boolean).map(safe).join('\n\n')||'未取得';$('bets').textContent=[h.betPrediction,h.oddsSummary,h.odds120].filter(Boolean).map(safe).join('\n\n')||'未取得';$('raw').textContent=JSON.stringify(h.raw||r,null,2)}function refresh(key){const a=read().filter(r=>r.race?.date&&r.race?.raceNo).sort((x,y)=>String(y.receivedAt||'').localeCompare(String(x.receivedAt||'')));$('count').textContent=a.length+'件';$('pick').innerHTML=a.length?a.map(r=>`<option value="${esc(r.key)}">${esc(r.race.date)} ${esc(r.race.stadiumName||r.race.stadium)} ${esc(r.race.raceNo)}R</option>`).join(''):'<option value="">受信データなし</option>';const r=a.find(v=>v.key===key)||a[0];if(r){$('pick').value=r.key;display(r)}else{$('view').classList.add('hidden');$('empty').classList.remove('hidden')}return a.length}function receive(){let n=0,last;try{const a=JSON.parse(localStorage.getItem(INBOX)||'[]');for(const x of Array.isArray(a)?a:[]){if(x?.source!=='BOAT_HUNTER')continue;try{last=save(x);n++}catch(e){console.warn('受信スキップ',e)}}}catch(e){console.warn(e)}refresh(last?.key);$('status').textContent=n?`${n}件を受信・更新しました`:'新しい受信データはありません';return n}function fromHash(){const m=location.hash.match(/(?:^#|&)(hunter599|hunter)=([^&]+)/);if(!m)return false;try{const x=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[2])))));if(x.source!=='BOAT_HUNTER')throw Error('HUNTERのデータではありません');const r=save(x);history.replaceState(null,'',location.pathname+location.search);refresh(r.key);$('status').textContent=`受信完了：${r.race.stadiumName||r.race.stadium} ${r.race.raceNo}R`;return true}catch(e){$('status').textContent='受信失敗：'+e.message;return true}}$('pick').onchange=e=>display(read().find(r=>r.key===e.target.value));$('sync').onclick=receive;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text()),a=Array.isArray(x)?x:Array.isArray(x.races)?x.races:Array.isArray(x.records)?x.records:[x];let n=0,last;for(const item of a){try{last=save(item);n++}catch(err){console.warn(err)}}refresh(last?.key);$('status').textContent=n?`${n}件を読み込みました`:'有効なレースデータがありません'}catch(err){$('status').textContent='読込失敗：'+err.message}e.target.value=''};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'DEME_LAB',version:8,races:read()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DEME_LAB_VOL8_DATA.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('clear').onclick=()=>{if(confirm('保存済み研究データを全件削除しますか？')){localStorage.removeItem(DB);refresh();$('status').textContent='削除しました'}};window.addEventListener('storage',e=>{if(e.key===INBOX)receive()});try{const bc=new BroadcastChannel('BH_HUNTER_CYCLE_V3');bc.onmessage=e=>{if(e.data?.payload){try{const r=save(e.data.payload);refresh(r.key)}catch(err){console.warn(err)}}else receive()}}catch(e){}if(!fromHash()){receive();if(!read().length)$('status').textContent='HUNTERからの転送を待っています'}})();</script></body></html>
